<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Dreamese Site Manager — v0.7.3</title>
  <link rel="icon" id="managerFavicon" href="assets/logo/dreamese-mark.png">
  <link rel="preload" href="css/fonts/UTM_Caviar.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/manager.css?v=0.7.3-fontsync3">
</head>
<body>
  <div class="manager-shell">
    <header class="manager-topbar">
      <div>
        <strong id="managerProductName">Dreamese Site Manager</strong>
        <span>v0.7.3</span>
      </div>
      <div class="manager-actions">
        <div class="device-edit-switch" id="deviceEditSwitch" aria-label="Chọn giao diện đang chỉnh">
          <button type="button" class="is-active" data-edit-device="desktop">Nội dung Desktop</button>
          <button type="button" data-edit-device="mobile">Nội dung Mobile</button>
        </div>
        <button type="button" class="ghost-button" id="openWebsite">Mở website</button>
        <button type="button" class="ghost-button" id="exportConfig">Sao lưu website</button>
        <label class="ghost-button file-button">Nhập cấu hình<input type="file" id="importConfig" accept="application/json"></label>
        <button type="button" class="primary-button" id="saveConfig">Lưu thay đổi</button>
      </div>
    </header>

    <aside class="manager-sidebar">
      <div class="manager-brand">
        <img id="managerSidebarLogo" src="assets/logo/dreamese-mark.png" alt="Logo thương hiệu">
        <div><strong>Quản trị website</strong><span id="saveStatus">Đang tải dữ liệu…</span></div>
      </div>
      <nav class="manager-tabs" id="managerTabs">
        <button type="button" class="is-active" data-panel="brand">Thương hiệu</button>
        <button type="button" data-panel="about">About Us</button>
        <button type="button" data-panel="projects">Projects</button>
        <button type="button" data-panel="service">Service</button>
        <button type="button" data-panel="media">Blog</button>
        <button type="button" data-panel="news">News</button>
        <button type="button" data-panel="contact">Contact</button>
        <button type="button" data-panel="layout">Kích thước & Font</button>
        <button type="button" data-panel="backup">Sao lưu</button>
      </nav>
    </aside>

    <main class="manager-editor" id="managerEditor"></main>

    <section class="manager-preview">
      <div class="preview-toolbar">
        <strong>Xem trước trực tiếp</strong>
        <div>
          <button type="button" data-preview-width="1440">Desktop</button>
          <button type="button" data-preview-width="820">Tablet</button>
          <button type="button" data-preview-width="390">Mobile</button>
          <button type="button" id="refreshPreview">Tải lại</button>
        </div>
      </div>
      <div class="preview-stage" id="previewStage">
        <iframe id="sitePreview" src="index.html?preview=1" title="Xem trước website Dreamese"></iframe>
      </div>
    </section>
  </div>

  <script src="js/default-data.js?v=0.7.3d"></script>
  <script src="js/store.js?v=0.7.3d"></script>
  <script src="js/manager.js?v=0.7.3d"></script>
</body>
</html>
